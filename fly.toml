# fly.toml app configuration file generated for learningmanagementsystem-s1g0gg on 2026-06-21T16:41:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'learningmanagementsystem-s1g0gg'
primary_region = 'ams'

[build]
  dockerfile = 'fly.Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_FORWARDEDHEADERS_ENABLED = 'true'
  ASPNETCORE_URLS = 'http://+:8080'
  LMS_SEED_SAMPLE = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '40s'
    method = 'get'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
