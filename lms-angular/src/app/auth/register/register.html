<section class="auth-card">
  <h1>Create account</h1>
  <p class="muted">Join Duare Shariye as a student or teacher.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="row">
      <label class="field">
        <span>First name</span>
        <input type="text" formControlName="firstName" autocomplete="given-name" required />
        @if (form.controls.firstName.touched && form.controls.firstName.invalid) {
          <small class="err">First name is required.</small>
        }
      </label>

      <label class="field">
        <span>Last name</span>
        <input type="text" formControlName="lastName" autocomplete="family-name" required />
        @if (form.controls.lastName.touched && form.controls.lastName.invalid) {
          <small class="err">Last name is required.</small>
        }
      </label>
    </div>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" required />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="err">Enter a valid email.</small>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" required />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="err">8+ chars with upper, lower, and a digit.</small>
      }
    </label>

    <label class="field">
      <span>Role</span>
      <select formControlName="role">
        <option value="Student">Student</option>
        <option value="Teacher">Teacher</option>
      </select>
    </label>

    @if (errorMessage()) {
      <div class="err banner">{{ errorMessage() }}</div>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating…' : 'Create account' }}
    </button>
  </form>

  <p class="muted small">
    Already have an account? <a routerLink="/login">Sign in</a>.
  </p>
</section>
