<section class="auth-card">
  <h1>Sign in</h1>
  <p class="muted">Welcome back. Enter your credentials to continue.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" required />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="err">Enter a valid email.</small>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" required />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="err">Password is required.</small>
      }
    </label>

    @if (errorMessage()) {
      <div class="err banner">{{ errorMessage() }}</div>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="muted small">
    <a routerLink="/auth/forgot-password">Forgot password?</a>
  </p>
  <p class="muted small">
    No account? <a routerLink="/register">Create one</a>.
  </p>
</section>
