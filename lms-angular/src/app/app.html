<header class="app-header">
  <a routerLink="/home" class="brand">LMS</a>
  <nav>
    @if (isAuthed()) {
      <span class="hello">{{ user()?.firstName }} ({{ user()?.role }})</span>
      <button type="button" (click)="logout()">Sign out</button>
    } @else {
      <a routerLink="/login">Sign in</a>
      <a routerLink="/register">Register</a>
    }
  </nav>
</header>

<main class="app-main">
  <router-outlet />
</main>
