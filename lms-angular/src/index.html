<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Daura-e-Ilmiyah Shariyah — Learn, teach, grow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a14">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts: Geist (sharp, modern UI sans), Space Grotesk (display headings),
       JetBrains Mono (code/IDs). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Space+Grotesk:wght@500..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Arabic Naskh fonts for the Qur'an reader. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400..700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap"
    rel="stylesheet">

  <!-- Apply the saved (or system) theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('lms.theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = saved ? saved === 'dark' : prefersDark;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* localStorage blocked — fall back to light */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
