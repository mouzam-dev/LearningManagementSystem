<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LMS — Learn, teach, grow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ee">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts: Inter for UI, Fraunces for the occasional display/serif accent. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
    rel="stylesheet">

  <!-- Apply the saved (or system) theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('lms.theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = saved ? saved === 'dark' : prefersDark;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* localStorage blocked — fall back to light */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
